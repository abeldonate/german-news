<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A2 Deck Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='cards.css') }}">
</head>
<body>
  <div class="backdrop"></div>
  <main class="deck-layout">
    <header class="deck-header">
      <p class="label">A2 Vocabulary</p>
      <h1>Spaced Deck</h1>
      <p class="sub">Tap the card to reveal translation, then give feedback.</p>
      <a class="home-link" href="{{ url_for('page_dashboard') }}">Back to dashboard</a>
      <a class="home-link" href="{{ url_for('page_news') }}">Open news reader</a>
    </header>

    <section class="card-wrap">
      <button id="deck-card" class="deck-card" type="button" aria-live="polite">
        <span id="card-front" class="card-front"></span>
        <span id="card-back" class="card-back" hidden></span>
      </button>

      <div class="actions" role="group" aria-label="Card feedback">
        <button class="fb fb-hard" data-rating="hard" type="button">Difficult (J)</button>
        <button class="fb fb-easy" data-rating="easy" type="button">Easy (K)</button>
      </div>

      <p id="deck-status" class="deck-status">Loading card...</p>
    </section>
  </main>

  <script>
    window.CARDS_CONFIG = {
      targetLang: "{{ target_lang }}"
    };
  </script>
  <script src="{{ url_for('static', filename='cards.js') }}"></script>
</body>
</html>
