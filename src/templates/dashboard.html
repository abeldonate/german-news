<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>German Learning Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <div class="backdrop"></div>
  <main class="dashboard-shell">
    <section class="dashboard-panel">
      <p class="eyebrow">German Learning Environment</p>
      <h1>Choose your training mode</h1>
      <p>Use the news reader for context-rich vocabulary, or drill A2 words with spaced repetition cards.</p>

      <div class="dashboard-actions">
        <a class="dashboard-btn" href="{{ url_for('page_news') }}">Open News Mode</a>
        <a class="dashboard-btn" href="{{ url_for('page_cards') }}">Open Cards Mode</a>
      </div>
    </section>
  </main>
</body>
</html>
