app:
  host: 0.0.0.0
  port: 5000
  target_lang: en
  max_articles: 10

api:
  tagesschau_homepage_api: https://www.tagesschau.de/api2u/homepage/
  translate_endpoint: https://api.mymemory.translated.net/get
  tts_lang: de
  request_timeout_seconds: 12
  user_agent: german-news-flask-app/1.0

features:
  # Paths to word-list files (one lemma per line, # lines are comments).
  # Each level should only contain words NOT already covered by lower levels.
  cefr_level_files:
    a1: data/a1.txt
    a2: data/a2.txt
    b1: data/b1.txt
    b2: data/b2.txt
    c1: data/c1.txt

  # YAML persistence used by the A2 Leitner deck.
  cards_state_file: data/cards_a2_state.yml

  # Maximum number of words active (boxes 1-5) at any time.
  # New words are introduced from box 0 as this headroom frees up.
  leitner_box0_limit: 50

  # Leitner box selection ratios (in percentages).
  # Determines the probability of drawing a card from each box.
  # Ratios are normalized automatically; they don't need to sum to 100.
  leitner_box_ratios:
    box0: 5    # New/unseen words
    box1: 60   # Recently learned
    box2: 15   # Consolidating
    box3: 10   # Advanced
    box4: 5    # Expert
    box5: 5    # Mastered (rarely review)

  # Block types from the Tagesschau API content array to include as article text.
  # Known types: text, headline, box, quotation, video, related
  content_block_types:
    - text
    - headline

